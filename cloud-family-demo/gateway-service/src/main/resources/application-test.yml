server:
  port: ${GATEWAY_TEST_SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_TEST_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: partner-service
              uri: ${PARTNER_SERVICE_TEST_URI:http://localhost:8082}
              predicates:
                - Path=/api/users/**
            - id: manager-service
              uri: ${MANAGER_SERVICE_TEST_URI:http://localhost:8083}
              predicates:
                - Path=/api/manager/**

demo:
  auth-service-url: ${AUTH_SERVICE_TEST_URL:http://localhost:8081}
  gateway:
    rate-limit:
      enabled: ${GATEWAY_TEST_RATE_LIMIT_ENABLED:true}
      max-requests: ${GATEWAY_TEST_RATE_LIMIT_MAX_REQUESTS:120}
      window-seconds: ${GATEWAY_TEST_RATE_LIMIT_WINDOW_SECONDS:60}
  auth:
    jwt:
      issuer: ${JWT_TEST_ISSUER:cloud-family-demo-test}
      secret: ${JWT_TEST_SECRET:cloud-family-demo-test-jwt-signing-secret-please-change-in-production}
  datasource:
    crypto:
      secret: ${DATASOURCE_TEST_CRYPTO_SECRET:cloud-family-demo-test-datasource-crypto-secret}
    cloud:
      url: ${FA_CLOUD_TEST_DB_URL:jdbc:mysql://localhost:3306/fa-cloud-test?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
      username: ${FA_CLOUD_TEST_DB_USERNAME:ENC(U0rj/0TFqN/ikdyYo1QcsZa9APbjTkdLYLth5ycDEk4=)}
      password: ${FA_CLOUD_TEST_DB_PASSWORD:ENC(O/mIkbzTm1uHasWUrJSMKaIDlfcpqXW6E8FFh3e0+Y0=)}
      maximum-pool-size: ${FA_CLOUD_TEST_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${FA_CLOUD_TEST_DB_MIN_IDLE:1}
      connection-timeout: ${FA_CLOUD_TEST_DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${FA_CLOUD_TEST_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${FA_CLOUD_TEST_DB_MAX_LIFETIME:1800000}
      validation-timeout: ${FA_CLOUD_TEST_DB_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${FA_CLOUD_TEST_DB_LEAK_DETECTION_THRESHOLD:0}
      pool-name: fa-cloud-test
    model:
      url: ${FA_MODEL_TEST_DB_URL:jdbc:mysql://localhost:3306/fa-model-test?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
      username: ${FA_MODEL_TEST_DB_USERNAME:ENC(U0rj/0TFqN/ikdyYo1QcsZa9APbjTkdLYLth5ycDEk4=)}
      password: ${FA_MODEL_TEST_DB_PASSWORD:ENC(O/mIkbzTm1uHasWUrJSMKaIDlfcpqXW6E8FFh3e0+Y0=)}
      maximum-pool-size: ${FA_MODEL_TEST_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${FA_MODEL_TEST_DB_MIN_IDLE:1}
      connection-timeout: ${FA_MODEL_TEST_DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${FA_MODEL_TEST_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${FA_MODEL_TEST_DB_MAX_LIFETIME:1800000}
      validation-timeout: ${FA_MODEL_TEST_DB_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${FA_MODEL_TEST_DB_LEAK_DETECTION_THRESHOLD:0}
      pool-name: fa-model-test
