spring:
  application:
    name: partner-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info

demo:
  gateway:
    internal-token: ${GATEWAY_INTERNAL_TOKEN:cloud-family-demo-gateway-internal-token}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:cloud-family-demo-producer}
