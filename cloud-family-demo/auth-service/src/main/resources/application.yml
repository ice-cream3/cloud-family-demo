spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info

demo:
  auth:
    login:
      # Empty/unset: randomly use all five schemes. Comma-separated values select a subset.
      # Values: graphic_set, graphic_sequence, graphic_pair, image_reassemble, image_slider.
      api:
        # mobile-frontend login and registration.
        enabled-challenge-schemes: ${AUTH_API_LOGIN_CHALLENGE_SCHEMES:}
      manager:
        # frontend management login.
        enabled-challenge-schemes: ${AUTH_MANAGER_LOGIN_CHALLENGE_SCHEMES:graphic_set}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:cloud-family-demo-producer}
